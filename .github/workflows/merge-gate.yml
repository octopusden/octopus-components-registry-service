# PUBLIC — every PR triggers this workflow and the gate/merge check must be green to merge.
name: Merge Gate

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-build.yml@v3.2.0
    with:
      java-version: '21'
      flow-type: hybrid
      docker-image: components-registry-service
    secrets: inherit

  quality:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-quality-gates.yml@v3.2.0
    with:
      java-version: '21'
    secrets: inherit

  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@v3.2.0
    with:
      java-version: '21'
      enable-codeql: true
      enable-trivy: true
      enable-dependency-check: false
    secrets: inherit

  # A change to the committed v4 contract must carry a consumer-facing changelog
  # entry. This is the rule api-changelog.md already states ("How to update"),
  # made non-optional.
  #
  # Deliberately narrow. Whether a behaviour change needs a numbered requirement
  # is a judgement a diff cannot make, and stays with review (AGENTS.md
  # § Technical Requirements Tracking). This checks the one thing a diff answers
  # exactly: the generated contract moved, so the consumers' changelog must say
  # what moved. OpenApiV4SpecTest already covers the other direction — a v4
  # source change whose committed spec was never regenerated.
  api-changelog:
    name: changelog/v4
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # No checkout: the file list comes from the API, so this needs neither a
      # clone nor the full history a merge-base diff would.
      #
      # The files endpoint, not `gh pr diff --name-only`: that serves the diff
      # media type, which answers 406 above 300 files. A large PR would fail
      # this job with "diff exceeded the maximum number of files" — blocking a
      # PR that may touch no contract at all, and that no changelog edit could
      # unblock. #428 changed 346 files, none of them the contract.
      - name: Require a changelog entry when the v4 contract changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SURFACE='components-registry-service-server/src/main/resources/openapi/v4.json'
          CHANGELOG='docs/registry/api-changelog.md'

          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')

          # -x -F: whole line, no regex. Paths arrive verbatim from the API.
          if ! grep -qxF "$SURFACE" <<<"$files"; then
            echo "v4 contract unchanged — nothing to check."
            exit 0
          fi
          if grep -qxF "$CHANGELOG" <<<"$files"; then
            echo "ok — v4 contract change carries a changelog entry."
            exit 0
          fi

          # The annotation has to be one line to render as one; the detail goes
          # to the log above it.
          cat >&2 <<MSG
          The v4 contract is what the Portal binds to, so a change to it needs a
          dated entry under "Unreleased" in $CHANGELOG saying what consumers see
          differently — a new field, endpoint, enum value, rename or removal.

          If the regenerated spec carries no consumer-visible change, say that in
          one line rather than committing a silent contract move.
          MSG
          echo "::error::$SURFACE changed but $CHANGELOG did not."
          exit 1

  # The compat module's own self-tests: the comparator, known-deltas matcher and
  # other pure-Kotlin suites (`:unitTest`, everything not tagged `http`) plus the
  # shell self-tests of the local-stands scripts. Neither runs in `build` — the
  # module's `check` is disabled so the URL-gated HTTP suites stay opt-in — so
  # this job is what executes them on a PR. Each count must be non-zero: a
  # suite that silently runs nothing must not read as green.
  compat-unit:
    name: compat/unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compat unit tests
        run: |
          set -euo pipefail
          rc=0
          ./gradlew :components-registry-compat-test:unitTest --no-daemon || rc=$?
          count=$(python3 -c 'import glob,sys,xml.etree.ElementTree as E; print(sum(int(E.parse(f).getroot().get("tests")) for f in glob.glob(sys.argv[1])))' \
            'components-registry-compat-test/build/test-results/unitTest/*.xml')
          echo "compat/unit: $count unitTest tests executed"
          if [ "$count" -eq 0 ]; then echo "::error:::unitTest executed no tests."; exit 1; fi
          exit "$rc"

      - name: Shell self-tests
        run: |
          set -uo pipefail
          ran=0 failed=0
          for t in scripts/local-stands/test/test-*.sh; do
            [ -f "$t" ] || continue
            ran=$((ran + 1))
            echo "::group::$t"
            if bash "$t"; then echo "ok: $t"; else echo "::error::$t failed"; failed=$((failed + 1)); fi
            echo "::endgroup::"
          done
          echo "compat/unit: $ran shell self-tests executed, $failed failed"
          if [ "$ran" -eq 0 ]; then echo "::error::no scripts/local-stands/test/test-*.sh found."; exit 1; fi
          [ "$failed" -eq 0 ]

      - name: Upload unitTest reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-unit-reports
          path: |
            components-registry-compat-test/build/reports/tests/unitTest/**
            components-registry-compat-test/build/test-results/unitTest/**
          if-no-files-found: warn

  gate-merge:
    name: gate/merge
    needs: [ build, quality, security, api-changelog, compat-unit ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: octopusden/octopus-base/.github/actions/merge-gate@v3.2.0
        with:
          needs: ${{ toJson(needs) }}
