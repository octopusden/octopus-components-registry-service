name: Sonar

on:
  # main only: a PR branch is already analysed through pull_request, and a second analysis of the
  # same SHA posts a second check run under the required context.
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes its analysis. A running main analysis is never cancelled; a
# superseded pending one may be dropped, and the newest main SHA is always analysed.
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonar:
    # A run started by Dependabot gets Dependabot secrets only, so SONAR_TOKEN is empty there.
    if: github.actor != 'dependabot[bot]'
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-sonar.yml@v3.4.1
    with:
      java-version: '21'
      quality-gate-wait: true
    secrets: inherit

  # Stands in for the required check `sonar / sonar/analysis` on Dependabot runs: a skipped
  # reusable-workflow call reports only `sonar`, which would leave the required context pending.
  sonar-dependabot:
    if: github.actor == 'dependabot[bot]'
    name: sonar / sonar/analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "::notice title=Sonar skipped::Dependabot runs get no SONAR_TOKEN; the analysis runs again on main after merge."
