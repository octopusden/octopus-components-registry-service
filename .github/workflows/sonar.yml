name: Sonar

on:
  # main only: a PR branch is already analysed through pull_request, and a second analysis of the
  # same SHA posts a second check run under the required context.
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR supersedes its analysis; main runs are never cancelled, each one is a baseline.
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonar:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-sonar.yml@v3.2.0
    with:
      java-version: '21'
      quality-gate-wait: true
    secrets: inherit
