# INTERNAL — triggered on push to main and manually; never on pull_request.
name: Quality Gates

on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    # octopus-base defaults to ubuntu-24.04; run dbTest on Docker 29 (ubuntu-26.04), see TD-031.
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-quality-gates.yml@v3.4.1
    with:
      java-version: '21'
      runs-on: ubuntu-26.04
    secrets: inherit
