//noinspection GroovyAssignabilityCheck
plugins {
    id 'org.jetbrains.kotlin.jvm'
}

java.sourceCompatibility = 1.8
java.targetCompatibility = 1.8

compileKotlin {
    kotlinOptions.jvmTarget = "1.8"
}

compileTestKotlin {
    kotlinOptions.jvmTarget = "1.8"
}

dependencies {
    api project(':components-registry-api')

    api "com.fasterxml.jackson.core:jackson-databind"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jdk8"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
    api "com.fasterxml.jackson.module:jackson-module-kotlin"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:${project.properties["kotlin.version"]}"
    implementation "org.jetbrains.kotlin:kotlin-main-kts:${project.properties["kotlin.version"]}"
    api "org.jetbrains.kotlin:kotlin-scripting-jsr223:${project.properties["kotlin.version"]}"
    api "org.jetbrains.kotlin:kotlin-scripting-common:${project.properties["kotlin.version"]}"
    api "org.jetbrains.kotlin:kotlin-scripting-jvm:${project.properties["kotlin.version"]}"
    api "org.jetbrains.kotlin:kotlin-scripting-jvm-host:${project.properties["kotlin.version"]}"
    api "org.jetbrains.kotlin:kotlin-scripting-compiler-embeddable:${project.properties["kotlin.version"]}"
    api "org.jetbrains.kotlin:kotlin-compiler-embeddable:${project.properties["kotlin.version"]}"
    implementation "org.jetbrains.kotlin:kotlin-reflect:${project.properties["kotlin.version"]}"

    testImplementation "org.assertj:assertj-core:${project['assertj.version']}"
}

// The `api` dependencies, resolvable. `api` itself is declare-only, and Gradle does not allow copying
// or resolving a configuration that is not resolvable.
configurations {
    dslLibraryClasspath {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom api
    }
}

task storeDslLibraryDependencies {
    doLast {
        def artifacts = ["${project.name}-${project.version}.jar"]
        configurations.dslLibraryClasspath.resolvedConfiguration.resolvedArtifacts.forEach { artifacts.add(it.file.name) }
        artifacts
        def file = file("${getLayout().getBuildDirectory().get().asFile}/resources/main/${project.name}.txt")
        file.getParentFile().mkdirs()
        file.write(artifacts.join('\n'))
    }
}

processResources.finalizedBy storeDslLibraryDependencies
