eureka:
  client:
    enabled: false

server:
  port: 4567

components-registry:
  vcs:
    enabled: false
  component-profiles:
    regular-external:
      kind: regular
      title: Regular external component
      description: An ordinary component delivered to the client, explicitly or as part of another component.
      order: 10
      classification: { external: true, explicit: ask }
      rules:
        name: { pattern: "^(?!.*(solution|dmp-bundle)).*$", message: "A regular component's key cannot contain solution or dmp-bundle. Choose the Solution or DMP Bundle profile." }
    regular-internal:
      kind: regular
      title: Regular internal component
      description: An ordinary component for internal use only, not delivered to the client.
      order: 20
      classification: { external: false, explicit: ask }
      rules:
        name: { pattern: "^(?!.*(solution|dmp-bundle)).*$", message: "A regular component's key cannot contain solution or dmp-bundle. Choose the Solution or DMP Bundle profile." }
    solution:
      kind: regular
      title: Solution
      description: A top-level component that groups and ships other components together.
      order: 30
      classification: { solution: true, external: true, explicit: true }
      rules:
        name: { pattern: "^[a-z][a-z0-9-]*-solution(-[a-z0-9-]+)?$", message: "A solution key contains -solution, e.g. payments-solution." }
    dmp-bundle:
      kind: regular
      title: DMP Bundle
      description: A bundle component, also a solution, shipped as one distribution.
      order: 40
      classification: { solution: true, external: true, explicit: true }
      rules:
        name: { pattern: "^[a-z][a-z0-9_-]*dmp-bundle[a-z0-9-]*$", message: "A DMP bundle key contains dmp-bundle, e.g. payments-dmp-bundle." }
  work-dir: /components-registry
  groovy-path: ${components-registry.work-dir}
  main-groovy-file: Aggregator.groovy
  supportedGroupIds: corp.domain
  supportedSystems: NONE,CLASSIC
  version-name:
    service-branch: serviceCBranch
    service: serviceC
    minor: minorC
  product-type:
    c: PT_C
    k: PT_K
    d: PT_D
    ddb: PT_D_DB
  copyright-path: ${components-registry.groovy-path}/copyrights

repositoryPath: /whiskey-builds
supportedGroupIds: corp.domain
supportedSystems: NONE,CLASSIC

teamcity:
  validation:
    gradle-build-template-id: AUTOMATION_GRADLE_TEMPLATE
    maven-build-template-id: AUTOMATION_MAVEN_TEMPLATE
    release-family-template-ids:
      - AUTOMATION_RELEASE_TEMPLATE
    gradle-default-build-step-id: AUTOMATION_GRADLE_STEP
    maven-default-build-step-id: AUTOMATION_MAVEN_STEP

# auth-server.url and auth-server.realm are injected by the OKD template as
# AUTH_SERVER_URL and AUTH_SERVER_REALM env vars (Spring's relaxed binding maps
# them to auth-server.url/realm). The actual values come from Gradle project
# properties at ocProcess time (-Pauth-server.url=..., -Pauth-server.realm=...),
# which TeamCity passes from its project configuration. Missing either will
# fail the Gradle build before the template is even processed.

octopus-security:
  roles:
    # Reads on v4 are public at the filter-chain level; ROLE_ANONYMOUS carries
    # ACCESS_COMPONENTS so @PreAuthorize on GET methods also passes without auth.
    ROLE_ANONYMOUS:
      - ACCESS_COMPONENTS
    ROLE_COMPONENTS_REGISTRY_VIEWER:
      - ACCESS_COMPONENTS
      - ACCESS_AUDIT
    ROLE_COMPONENTS_REGISTRY_EDITOR:
      - ACCESS_COMPONENTS
      - CREATE_COMPONENTS
      - ACCESS_AUDIT
    # Super-admin — reuses existing Keycloak realm-role `ADMIN`.
    ROLE_ADMIN:
      - ACCESS_COMPONENTS
      - CREATE_COMPONENTS
      # Bypass the per-component owner/RM/SC edit check (e.g. reassign a departed owner).
      - EDIT_ANY_COMPONENT
      - ARCHIVE_COMPONENTS
      - RENAME_COMPONENTS
      - DELETE_COMPONENTS
      - IMPORT_DATA
      - ACCESS_AUDIT
      - EDIT_METADATA

logging:
  level:
    org.octopusden.octopus.escrow: DEBUG
    org.octopusden.octopus.crs: DEBUG
    org.octopusden.octopus.components.registry: DEBUG
