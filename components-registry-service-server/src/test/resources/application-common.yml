server:
  port: 4567

components-registry:
  vcs:
    enabled: false
  # The start-page profiles; CRS does not start without at least one valid regular profile.
  component-profiles:
    regular-external:
      kind: regular
      title: Regular external component
      description: An ordinary component delivered to the client, explicitly or as part of another component.
      order: 10
      classification: { external: true, explicit: ask }
      rules:
        name: { pattern: "^(?!.*(solution|dmp-bundle)).*$", message: "A regular component's key cannot contain solution or dmp-bundle. Choose the Solution or DMP Bundle profile." }
    regular-internal:
      kind: regular
      title: Regular internal component
      description: An ordinary component for internal use only, not delivered to the client.
      order: 20
      classification: { external: false, explicit: ask }
      rules:
        name: { pattern: "^(?!.*(solution|dmp-bundle)).*$", message: "A regular component's key cannot contain solution or dmp-bundle. Choose the Solution or DMP Bundle profile." }
    solution:
      kind: regular
      title: Solution
      description: A top-level component that groups and ships other components together.
      order: 30
      classification: { solution: true, external: true, explicit: true }
      rules:
        name: { pattern: "^[a-z][a-z0-9-]*-solution(-[a-z0-9-]+)?$", message: "A solution key contains -solution, e.g. payments-solution." }
    dmp-bundle:
      kind: regular
      title: DMP Bundle
      description: A bundle component, also a solution, shipped as one distribution.
      order: 40
      classification: { solution: true, external: true, explicit: true }
      rules:
        name: { pattern: "^[a-z][a-z0-9_-]*dmp-bundle[a-z0-9-]*$", message: "A DMP bundle key contains dmp-bundle, e.g. payments-dmp-bundle." }
  work-dir: ${COMPONENTS_REGISTRY_SERVICE_TEST_DATA_DIR}/components-registry/common
  main-groovy-file: Aggregator.groovy
  groovy-path: ${components-registry.work-dir}
  dependency-mapping-file: dependency_mapping.properties

  # `org.example` is included so the broad test-fixture convention
  # (`org.example.test` as the standard RFC 2606 placeholder, used by 14
  # test files) passes the new server-side `validateGroupKeyPrefix` check.
  # Rejection tests use a prefix that is NOT in this list (e.g.
  # `com.someoneelse.*`).
  supportedGroupIds: org.octopusden.octopus,io.bcomponent,org.example
  supportedSystems: NONE,CLASSIC,ALFA
  version-name:
    service-branch: serviceCBranch
    service: serviceC
    minor: minorC
  product-type:
    c: PT_C
    k: PT_K
    d: PT_D
    ddb: PT_D_DB

pathToConfig: file://${components-registry.groovy-path}

# Employee-service active-employee check is OFF in tests by default — no real
# calls. Tests that exercise the active-check path inject a mocked
# EmployeeDirectoryService instead of flipping this flag.
employee-service:
  enabled: false

teamcity:
  validation:
    gradle-build-template-id: FIXTURE_GRADLE_TEMPLATE
    maven-build-template-id: FIXTURE_MAVEN_TEMPLATE
    release-family-template-ids:
      - FIXTURE_RELEASE_TEMPLATE
    gradle-default-build-step-id: FIXTURE_GRADLE_STEP
    maven-default-build-step-id: FIXTURE_MAVEN_STEP

eureka.client.enabled: false

management:
  endpoints:
    web:
      exposure:
        include: metrics, prometheus
    loggers:
      enabled: true

# Stub auth-server URL so NimbusJwtDecoder gets a well-formed jwk-set-uri at
# context init. AuthServerClient is replaced with a Mockito mock via @MockBean
# in every @SpringBootTest, so no HTTP call is actually made against this URL;
# MockMvc jwt() post-processor bypasses the decoder entirely.
auth-server:
  url: http://localhost:0
  realm: test

octopus-security:
  roles:
    ROLE_ANONYMOUS:
      - ACCESS_COMPONENTS
    ROLE_COMPONENTS_REGISTRY_VIEWER:
      - ACCESS_COMPONENTS
      - ACCESS_AUDIT
    ROLE_COMPONENTS_REGISTRY_EDITOR:
      - ACCESS_COMPONENTS
      - CREATE_COMPONENTS
      - ACCESS_AUDIT
    ROLE_ADMIN:
      - ACCESS_COMPONENTS
      - CREATE_COMPONENTS
      - EDIT_ANY_COMPONENT
      - ARCHIVE_COMPONENTS
      - RENAME_COMPONENTS
      - DELETE_COMPONENTS
      - IMPORT_DATA
      - ACCESS_AUDIT
      - EDIT_METADATA
